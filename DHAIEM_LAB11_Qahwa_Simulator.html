ersist()" placeholder="Write 2–3 sentences">${esc(state.answers[i])}</textarea><details><summary>Need a hint?</summary>${hints[i]}</details></div>`).join('')}<button class="primary" onclick="exportAnswers()">Save my answers (.txt)</button><p>Paste six real screenshots and your answers into Word. The handout names the file MIS250_Lab2_YourID_YourName.docx; use Lab 11 if your instructor requires that number. Upload to Blackboard.</p><details><summary>OrangeHRM reset or missing records?</summary>Reset filters and search your exact name. If records are gone, capture the empty result, label it Reset, and recreate only what remains. Earlier screenshots still count. Tell your instructor if time runs out.</details><button onclick="render()">Return to simulator</button></section>`}function exportAnswers(){let b=new Blob([questions.map((q,i)=>q+'\n'+state.answers[i]).join('\n\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Lab11_answers.txt';a.click();URL.revokeObjectURL(a.href)}render();</script></body></html>
