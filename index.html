<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  /* 0. Inline Flashcards */
  document.querySelectorAll(".fc").forEach(function (card) {
    function toggle() {
      card.classList.toggle("open");
      var open = card.classList.contains("open");
      card.setAttribute("aria-expanded", open ? "true" : "false");
      var lbl = card.querySelector(".fc-lbl");
      if (lbl) lbl.textContent = open ? "إخفاء الجواب" : "اكشف الجواب";
    }
    card.addEventListener("click", toggle);
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  });

  /* 1. PV & NPV Lab */
  var pvFv = document.getElementById("pvFv"), pvDf = document.getElementById("pvDf");
  var pvVal = document.getElementById("pvVal"), pvNpv = document.getElementById("pvNpv");
  var pvNpvBox = document.getElementById("pvNpvBox"), pvNote = document.getElementById("pvNote");
  var pvMap = {
    jack: {fv:"$2,420",df:"1.2100",pv:"$2,000.00",npv:"+$1,500 (DO IT)",cls:"kpi-box up",
      n:"<b>مثال روبوت الألعاب لجاك:</b> التكلفة الأولية $500، والبيع بعد سنتين بـ $2,420 عند فائدة 10%. القيمة الحالية = $2,000، وصافي القيمة الحالية = +$1,500 (موجب &rarr; نفّذ المشروع!)."},
    s11_1: {fv:"$110",df:"1.1000",pv:"$100.00",npv:"PV Only ($100)",cls:"kpi-box up",
      n:"<b>مثال الشريحة 11 (سنة واحدة):</b> $110 بعد سنة واحدة بفائدة 10% تعادل $100 اليوم (110 / 1.1 = 100)."},
    s11_2: {fv:"$110",df:"1.2100",pv:"$90.91",npv:"PV Only ($90.91)",cls:"kpi-box up",
      n:"<b>مثال الشريحة 11 (سنتان):</b> $110 بعد سنتين بفائدة 10% تعادل $90.91 اليوم (110 / 1.21 = 90.91)."},
    p613: {fv:"$100",df:"2.5937",pv:"$38.55",npv:"PV Only ($38.55)",cls:"kpi-box up",
      n:"<b>مثال الكتاب صفحة 613 (10 سنوات):</b> $100 بعد 10 سنوات بفائدة 10% تعادل $38.55 اليوم."},
    rq2: {fv:"$500",df:"1.1576",pv:"$431.92",npv:"PV Only ($431.92)",cls:"kpi-box up",
      n:"<b>سؤال Review Quiz #2 صفحة 614:</b> القيمة الحالية لـ $500 بعد 3 سنوات بفائدة 5% هي $431.92."},
    neg: {fv:"$2,420",df:"5.2900",pv:"$457.47",npv:"-$42.53 (DON'T)",cls:"kpi-box dn",
      n:"<b>أثر ارتفاع سعر الفائدة:</b> إذا ارتفعت الفائدة إلى 130%، تنخفض القيمة الحالية إلى $457.47 وتصبح أقل من التكلفة ($500)، فيصبح NPV سالباً (-$42.53) ونرفض المشروع!"}
  };
  document.querySelectorAll("[data-pv]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-pv]").forEach(function (b) { b.classList.toggle("active", b === btn); });
      var d = pvMap[btn.getAttribute("data-pv")];
      if (!d) return;
      pvFv.textContent = d.fv; pvDf.textContent = d.df;
      pvVal.textContent = d.pv; pvNpv.textContent = d.npv;
      pvNpvBox.className = d.cls; pvNote.innerHTML = d.n;
    });
  });

  /* 2. Bond Price & Real Interest Rate Lab */
  var bndPay = document.getElementById("bndPay"), bndPrice = document.getElementById("bndPrice");
  var bndRate = document.getElementById("bndRate"), bndReal = document.getElementById("bndReal");
  var bndNote = document.getElementById("bndNote");
  var bndMap = {
    base: {pay:"$5 / yr",price:"$50.00",rate:"10.0%",real:"8.0%",
      n:"<b>العلاقة العكسية:</b> عندما يكون العائد السنوي الثابت $5 وسعر السند $50، يكون سعر الفائدة <span class='ltr'>5 / 50 = 10%</span>."},
    up: {pay:"$5 / yr",price:"$200.00",rate:"2.5%",real:"0.5%",
      n:"<b>ارتفاع سعر السند إلى $200:</b> ينخفض سعر الفائدة إلى <span class='ltr'>5 / 200 = 2.5%</span> (علاقة عكسية تماماً)."},
    dn: {pay:"$5 / yr",price:"$20.00",rate:"25.0%",real:"23.0%",
      n:"<b>انخفاض سعر السند إلى $20:</b> يرتفع سعر الفائدة إلى <span class='ltr'>5 / 20 = 25%</span>."},
    p614_5: {pay:"$105 (1 yr)",price:"$100.00",rate:"5.0%",real:"3.0%",
      n:"<b>مثال الكتاب صفحة 614 (فائدة 5%):</b> سند يدفع $105 بعد سنة واحدة يكون سعره اليوم <span class='ltr'>105 / 1.05 = $100</span>."},
    p614_10: {pay:"$105 (1 yr)",price:"$95.45",rate:"10.0%",real:"8.0%",
      n:"<b>مثال الكتاب صفحة 614 (فائدة 10%):</b> عند ارتفاع الفائدة إلى 10%، ينخفض سعر السند إلى <span class='ltr'>105 / 1.10 = $95.45</span>."}
  };
  document.querySelectorAll("[data-bnd]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-bnd]").forEach(function (b) { b.classList.toggle("active", b === btn); });
      var d = bndMap[btn.getAttribute("data-bnd")];
      if (!d) return;
      bndPay.textContent = d.pay; bndPrice.textContent = d.price;
      bndRate.textContent = d.rate; bndReal.textContent = d.real;
      bndNote.innerHTML = d.n;
    });
  });

  /* 3. Loanable Funds Graph Lab */
  var lfS = document.getElementById("lfS"), lfD = document.getElementById("lfD");
  var lfS_old = document.getElementById("lfS_old"), lfD_old = document.getElementById("lfD_old");
  var lfPy = document.getElementById("lfPy"), lfPx = document.getElementById("lfPx");
  var lfPyL = document.getElementById("lfPyL"), lfPxL = document.getElementById("lfPxL");
  var lfDot = document.getElementById("lfDot"), lfDotL = document.getElementById("lfDotL");
  var lfDotOld = document.getElementById("lfDotOld");
  var lfK1 = document.getElementById("lfK1"), lfK2 = document.getElementById("lfK2");
  var lfK3 = document.getElementById("lfK3"), lfK4 = document.getElementById("lfK4");
  var lfNote = document.getElementById("lfNote");
  var lfData = {
    base:{sx:110,dx:110,ex:202,ey:125,ghost:false,r:"6%",lf:"$2.0T",ps:"$2.0T",iv:"$2.0T",dl:"E0 (6%, $2.0T)",
      n:"<b>التوازن الأساسي:</b> يتقاطع عرض الأموال (SLF) مع الطلب (DLF) عند فائدة حقيقية 6% وكمية $2.0 تريليون."},
    d_up:{sx:110,dx:166,ex:230,ey:97,ghost:true,r:"7% (UP)",lf:"$2.5T (UP)",ps:"$2.5T (UP)",iv:"$2.5T (UP)",dl:"E1 (7%, $2.5T)",
      n:"<b>زيادة الربح المتوقع:</b> ينزاح منحنى DLF يميناً إلى DLF1، فترتفع الفائدة الحقيقية إلى 7% وتزداد كمية الأموال والادخار إلى $2.5T."},
    s_up:{sx:166,dx:110,ex:230,ey:153,ghost:true,r:"5% (DOWN)",lf:"$2.5T (UP)",ps:"$2.5T (UP)",iv:"$2.5T (UP)",dl:"E1 (5%, $2.5T)",
      n:"<b>زيادة الادخار:</b> ينزاح منحنى SLF يميناً إلى SLF1، فتنخفض الفائدة الحقيقية إلى 5% ويزداد الاستثمار إلى $2.5T."},
    surp:{sx:166,dx:110,ex:230,ey:153,ghost:true,r:"5% (DOWN)",lf:"$2.5T (UP)",ps:"$1.5T (DOWN)",iv:"$2.5T (UP)",dl:"Surplus (5%, $2.5T)",
      n:"<b>فائض ميزانية الحكومة $1T:</b> ينزاح العرض من PSLF إلى SLF بمقدار $1T، فتنخفض الفائدة إلى 5%، ويزيد الاستثمار الكلي إلى $2.5T، بينما ينخفض الادخار الخاص إلى $1.5T."},
    def:{sx:110,dx:166,ex:230,ey:97,ghost:true,r:"7% (UP)",lf:"$2.5T (UP)",ps:"$2.5T (UP)",iv:"$1.5T (CROWDED OUT)",dl:"Deficit (7%, $2.5T)",
      n:"<b>عجز ميزانية الحكومة $1T:</b> ينزاح الطلب من PDLF إلى DLF بمقدار $1T، فترتفع الفائدة إلى 7%، ويزيد الادخار الخاص إلى $2.5T، وينخفض الاستثمار الخاص إلى $1.5T (Crowding-Out)."},
    rb:{sx:166,dx:166,ex:258,ey:125,ghost:true,r:"6% (UNCHANGED)",lf:"$3.0T (UP)",ps:"$3.0T (UP)",iv:"$2.0T (UNCHANGED)",dl:"Ricardo-Barro (6%, $3.0T)",
      n:"<b>أثر ريكاردو-بارو:</b> يزيد العجز الطلب (PDLF &rarr; DLF)، ويرفع دافعو الضرائب العقلاء ادخارهم بنفس المقدار (SLF0 &rarr; SLF1)، فتبقى الفائدة 6% والاستثمار $2.0T ويُتجنب Crowding-Out!"}
  };
  document.querySelectorAll("[data-lf]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("[data-lf]").forEach(function (b) { b.classList.toggle("active", b === btn); });
      var d = lfData[btn.getAttribute("data-lf")];
      if (!d) return;
      lfS.style.left = d.sx + "px"; lfD.style.left = d.dx + "px";
      lfPy.style.top = d.ey + "px"; lfPy.style.width = d.ex + "px";
      lfPx.style.left = d.ex + "px"; lfPx.style.height = (250 - d.ey) + "px";
      lfDot.style.left = d.ex + "px"; lfDot.style.top = d.ey + "px";
      lfDotL.textContent = d.dl; lfPyL.textContent = d.r.split(" ")[0]; lfPxL.textContent = d.lf.split(" ")[0];
      lfS_old.style.opacity = d.ghost ? "1" : "0"; lfD_old.style.opacity = d.ghost ? "1" : "0";
      lfDotOld.style.opacity = d.ghost ? "1" : "0";
      lfK1.textContent = d.r; lfK2.textContent = d.lf; lfK3.textContent = d.ps; lfK4.textContent = d.iv;
      lfNote.innerHTML = d.n;
    });
  });

  /* 4. Self-Grading Exam */
  var cards = Array.prototype.slice.call(document.querySelectorAll(".qc"));
  var scoreEl = document.getElementById("score"), progEl = document.getElementById("progress");
  var resultBox = document.getElementById("result"), finalScore = document.getElementById("finalScore");
  var resultMsg = document.getElementById("resultMsg"), graded = false;
  function answeredCount() {
    var n = 0; cards.forEach(function (c) { if (c.querySelector("input:checked")) n++; }); return n;
  }
  function updateProgress() { progEl.textContent = "أجبت على " + answeredCount() + " من " + cards.length; }
  document.querySelectorAll(".qc input").forEach(function (inp) {
    inp.addEventListener("change", function () { if (!graded) updateProgress(); });
  });
  document.getElementById("gradeBtn").addEventListener("click", function () {
    var correct = 0;
    cards.forEach(function (card) {
      var answer = card.getAttribute("data-answer"), picked = card.querySelector("input:checked");
      var explain = card.querySelector(".q-explain");
      card.classList.remove("good", "bad");
      card.querySelectorAll(".opt").forEach(function (o) {
        o.classList.remove("correct", "wrong");
        if (o.querySelector("input").value === answer) o.classList.add("correct");
      });
      if (picked && picked.value === answer) { correct++; card.classList.add("good"); }
      else { card.classList.add("bad"); if (picked) picked.closest(".opt").classList.add("wrong"); }
      if (explain) explain.classList.add("show");
    });
    graded = true; scoreEl.textContent = correct; finalScore.textContent = correct; resultBox.classList.add("show");
    var pct = Math.round((correct / cards.length) * 100);
    resultMsg.textContent = (correct >= 22 ? "ممتاز جداً! أتقنت الفصل 24 بالكامل." : "جيد، راجع الشرح أسفل الأسئلة التي أخطأت فيها.") + " (" + pct + "%)";
    resultBox.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  document.getElementById("resetExam").addEventListener("click", function () {
    cards.forEach(function (card) {
      card.classList.remove("good", "bad");
      card.querySelectorAll("input").forEach(function (i) { i.checked = false; });
      card.querySelectorAll(".opt").forEach(function (o) { o.classList.remove("correct", "wrong"); });
      var ex = card.querySelector(".q-explain"); if (ex) ex.classList.remove("show");
    });
    graded = false; scoreEl.textContent = "0"; resultBox.classList.remove("show"); updateProgress();
    document.getElementById("exam").scrollIntoView({ behavior: "smooth" });
  });
  updateProgress();

  /* 5. Sidebar Nav, Readbar & Completion */
  var links = Array.prototype.slice.call(document.querySelectorAll(".nav a"));
  var sections = links.map(function (a) { return document.querySelector(a.getAttribute("href")); });
  function setActive() {
    var pos = window.scrollY + 140, idx = 0;
    sections.forEach(function (s, i) { if (s && s.offsetTop <= pos) idx = i; });
    links.forEach(function (a, i) { a.classList.toggle("on", i === idx); });
  }
  window.addEventListener("scroll", setActive, { passive: true }); setActive();
  var readbar = document.getElementById("readbar");
  function updateRead() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    readbar.style.width = Math.min(100, Math.max(0, h > 0 ? (window.scrollY / h) * 100 : 0)) + "%";
  }
  window.addEventListener("scroll", updateRead, { passive: true }); window.addEventListener("resize", updateRead); updateRead();
  var STORE = "econ102ch24v5.done", doneList = [];
  try { doneList = JSON.parse(localStorage.getItem(STORE) || "[]"); } catch (e) {}
  var secs = Array.prototype.slice.call(document.querySelectorAll('.sec[id^="s"]'));
  var spNum = document.getElementById("spNum"), spFill = document.getElementById("spFill");
  function paintProgress() {
    spNum.textContent = doneList.length + " / " + secs.length;
    spFill.style.width = (doneList.length / secs.length * 100) + "%";
  }
  secs.forEach(function (sec) {
    var btn = document.createElement("button"); btn.type = "button"; btn.className = "sec-done";
    btn.innerHTML = '<span class="tick">✓</span><span class="lbl">خلصت هذا القسم</span>';
    if (doneList.indexOf(sec.id) !== -1) btn.classList.add("done");
    btn.addEventListener("click", function () {
      var i = doneList.indexOf(sec.id);
      if (i === -1) { doneList.push(sec.id); btn.classList.add("done"); } else { doneList.splice(i, 1); btn.classList.remove("done"); }
      try { localStorage.setItem(STORE, JSON.stringify(doneList)); } catch (e) {}
      paintProgress();
    });
    sec.appendChild(btn);
  });
  paintProgress();

  /* 6. Flashcards */
  var deck = Array.prototype.slice.call(document.querySelectorAll(".dcard"));
  var deckCount = document.getElementById("deckCount"), deckDots = document.getElementById("deckDots"), dIdx = 0;
  deck.forEach(function (c, i) {
    var d = document.createElement("i"); d.addEventListener("click", function () { showCard(i); }); deckDots.appendChild(d);
    c.addEventListener("click", function () { c.classList.toggle("flipped"); });
  });
  function showCard(i) {
    dIdx = (i + deck.length) % deck.length;
    deck.forEach(function (c, n) { c.classList.toggle("active", n === dIdx); c.classList.remove("flipped"); });
    Array.prototype.forEach.call(deckDots.children, function (d, n) { d.classList.toggle("on", n === dIdx); });
    deckCount.textContent = (dIdx + 1) + " من " + deck.length;
  }
  document.getElementById("deckFlip").addEventListener("click", function () { deck[dIdx].classList.toggle("flipped"); });
  document.getElementById("deckNext").addEventListener("click", function () { showCard(dIdx + 1); });
  document.getElementById("deckPrev").addEventListener("click", function () { showCard(dIdx - 1); });
  document.getElementById("deckShuffle").addEventListener("click", function () {
    var stage = document.getElementById("deckStage"), arr = deck.slice();
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    arr.forEach(function (c) { stage.appendChild(c); }); deck = arr; showCard(0);
  });
  showCard(0);

  /* 7. Matching Game */
  var board = document.getElementById("matchBoard"), mScore = document.getElementById("matchScore"), mTries = document.getElementById("matchTries");
  var sel = null, score = 0, tries = 0, locked = false;
  function resetMatch() {
    score = 0; tries = 0; sel = null; locked = false; mScore.textContent = "0"; mTries.textContent = "0";
    board.querySelectorAll(".m-item").forEach(function (b) { b.classList.remove("done", "sel", "bad"); });
    var arr = Array.prototype.slice.call(board.querySelectorAll("#mDefs .m-item"));
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    var col = document.getElementById("mDefs"); arr.forEach(function (b) { col.appendChild(b); });
  }
  board.addEventListener("click", function (e) {
    var btn = e.target.closest(".m-item"); if (!btn || locked || btn.classList.contains("done")) return;
    if (!sel) { sel = btn; btn.classList.add("sel"); return; }
    if (sel === btn) { btn.classList.remove("sel"); sel = null; return; }
    if (sel.parentElement === btn.parentElement) { sel.classList.remove("sel"); sel = btn; btn.classList.add("sel"); return; }
    tries++; mTries.textContent = tries;
    if (sel.getAttribute("data-id") === btn.getAttribute("data-id")) {
      sel.classList.remove("sel"); sel.classList.add("done"); btn.classList.add("done"); sel = null; score++; mScore.textContent = score;
    } else {
      locked = true; var a = sel, b = btn; a.classList.remove("sel"); a.classList.add("bad"); b.classList.add("bad");
      setTimeout(function () { a.classList.remove("bad"); b.classList.remove("bad"); locked = false; }, 480); sel = null;
    }
  });
  document.getElementById("matchReset").addEventListener("click", resetMatch); resetMatch();

  /* 8. Glossary Search */
  var glInput = document.getElementById("glSearch"), glItems = Array.prototype.slice.call(document.querySelectorAll("#glList .gl")), glCount = document.getElementById("glCount");
  glInput.addEventListener("input", function () {
    var q = glInput.value.trim().toLowerCase(), shown = 0;
    glItems.forEach(function (it) { var hit = q === "" || it.textContent.toLowerCase().indexOf(q) !== -1; it.classList.toggle("hide", !hit); if (hit) shown++; });
    glCount.textContent = shown + " من " + glItems.length + " مصطلحاً";
  });
});
</script>
